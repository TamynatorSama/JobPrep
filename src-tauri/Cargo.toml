[package]
name = "interprep"
version = "0.1.0"
description = "Audio Service"
edition = "2021"
rust-version = "1.77"
# Disable bin auto-discovery so the explicit [[bin]] below is the only binary —
# its name becomes the on-disk exe name (and thus the Task Manager process name).
autobins = false

# Library target — Tauri's mobile entry-point macros + the bin re-export
# both rely on the crate being usable as a library.
[lib]
name = "interprep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The shipped/dev process is named to blend in (decoy "AudioService"), not
# "interprep". Keep in sync with `mainBinaryName` in tauri.conf.json. The exe
# name is the only stealth lever here — the OS can't rename a running process.
[[bin]]
name = "AudioService"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
hound = "3.5"
wasapi = "0.23"
anyhow = "1.0"
base64 = "0.22"
dirs = "5"
opener = "0.7"
getrandom = "0.2"          # OS CSPRNG for the bridge pairing token
# Sign in with ChatGPT (chatgpt_auth.rs): PKCE S256 challenge + RS256 ID-token
# verification against OpenAI's published JWKS.
sha2 = "0.10"
jsonwebtoken = "9"
# Silero VAD for the copilot's live endpointing (vad.rs), in-process on the CPU:
# ~0.1 ms per 32 ms frame. download-binaries fetches a prebuilt ONNX Runtime at
# build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs"] }

# Win32 — SetWindowDisplayAffinity for the stealth copilot overlay (cloaks the
# window from screen capture), and the copilot's screenshot → answer
# (screen.rs): GDI capture, WinRT OCR + JPEG encoding. Windows-only; the app is
# Windows-only anyway.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
] }
# WebView2 settings on the copilot overlay (no context menu / autofill / status
# bar / browser accelerator popups — each is its own window outside the capture
# cloak). Versions MUST match what wry pins (webview2-com 0.38 → windows-core
# 0.61), since PlatformWebview::controller() hands us wry's own interface types.
webview2-com = "0.38"
windows-core-61 = { package = "windows-core", version = "0.61" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
