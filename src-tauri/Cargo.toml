[package]
name = "interprep"
version = "0.1.0"
description = "InterPrep — AI Interview Prep"
edition = "2021"
rust-version = "1.77"

# Library target — Tauri's mobile entry-point macros + the bin re-export
# both rely on the crate being usable as a library.
[lib]
name = "interprep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
